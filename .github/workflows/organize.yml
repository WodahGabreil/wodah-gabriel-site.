name: Organize files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into folders
        run: |
          mkdir -p src/components src/hooks src/content public/evidence scripts
          for f in About CaseStudies CaseStudyCard Contact ContactForm EvidenceGallery Footer FreelancePlatforms GrowthVisual Hero Icons Lightbox Nav Reveal Services; do
            [ -f "$f.tsx" ] && git mv "$f.tsx" "src/components/$f.tsx"
          done
          [ -f assets.ts ] && git mv assets.ts src/components/assets.ts
          for f in useActiveSection useCountUp useInView; do
            [ -f "$f.ts" ] && git mv "$f.ts" "src/hooks/$f.ts"
          done
          for f in caseStudies process services site testimonials types; do
            [ -f "$f.ts" ] && git mv "$f.ts" "src/content/$f.ts"
          done
          for f in App.tsx main.tsx index.css vite-env.d.ts; do
            [ -f "$f" ] && git mv "$f" "src/$f"
          done
          for f in favicon.svg robots.txt og-image.png apple-touch-icon.png; do
            [ -f "$f" ] && git mv "$f" "public/$f"
          done
          [ -f README.txt ] && git mv README.txt public/evidence/README.txt
          [ -f build-local.mjs ] && git mv build-local.mjs scripts/build-local.mjs
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Organize files into folders"
          git push
